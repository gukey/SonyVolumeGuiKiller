name: Publish Windows 1.0.6
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and publish complete Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Check-Exit { if ($LASTEXITCODE -ne 0) { throw "Command failed: $LASTEXITCODE" } }
          $inputDir = Join-Path $env:RUNNER_TEMP 'sony-input'
          $stage = Join-Path $env:RUNNER_TEMP 'sony-release'
          $package = Join-Path $stage 'SonyVolumeGuiKiller-PC-1.0.6-win-x64'
          New-Item -ItemType Directory -Force -Path $inputDir,$package | Out-Null
          gh release download adb-helper-v0.3.5-sony.1 --pattern AdbAutoEnable5555-0.3.5-sony.1-debug.apk --dir $inputDir
          Check-Exit
          gh release download v1.0.6 --pattern SonyVolumeGuiKiller-1.0.5-debug.apk --dir $inputDir
          Check-Exit
          $helper = Join-Path $inputDir 'AdbAutoEnable5555-0.3.5-sony.1-debug.apk'
          $guard = Join-Path $inputDir 'SonyVolumeGuiKiller-1.0.5-debug.apk'
          if ((Get-FileHash $helper).Hash -ne '820644DE7B7745C81ABF8DAB284E36E973643344A52D9089CC0949C38484371A') { throw 'Helper APK hash mismatch' }
          if ((Get-FileHash $guard).Hash -ne 'B26380FC152F202345AE4925F0E553828C9C49A65EAE04164D737E7DAD2B7C8B') { throw 'Guard APK hash mismatch' }
          $platformZip = Join-Path $inputDir 'platform-tools.zip'
          Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile $platformZip
          Expand-Archive -LiteralPath $platformZip -DestinationPath (Join-Path $inputDir 'android-tools')
          $tools = Join-Path $inputDir 'android-tools/platform-tools'
          if (-not (Test-Path (Join-Path $tools 'adb.exe'))) { throw 'Official ADB tools missing' }
          dotnet publish pc/SonyVolumeGuiKillerPcManager.csproj -c Release -r win-x64 --self-contained true -o $package "-p:AdbToolsDir=$tools" "-p:AutoEnableApk=$helper" "-p:GuardApk=$guard" --nologo
          Check-Exit
          if ((Get-Item (Join-Path $package 'SonyVolumeGuiKillerPcManager.exe')).VersionInfo.ProductVersion -notlike '1.0.6*') { throw 'EXE version mismatch' }
          if ((Get-FileHash (Join-Path $package 'apk/adb-auto-enable-fix.apk')).Hash -ne (Get-FileHash $helper).Hash) { throw 'Published helper mismatch' }
          if ((Get-FileHash (Join-Path $package 'apk/SonyVolumeGuiKiller-release.apk')).Hash -ne (Get-FileHash $guard).Hash) { throw 'Published guard mismatch' }
          Copy-Item -LiteralPath $tools -Destination $package -Recurse
          Copy-Item -LiteralPath 'docs/images' -Destination $package -Recurse
          Copy-Item -LiteralPath README.md -Destination (Join-Path $package '使用说明.md')
          $pdb = Join-Path $package 'SonyVolumeGuiKillerPcManager.pdb'
          if (Test-Path $pdb) { Remove-Item -LiteralPath $pdb }
          $zip = Join-Path $stage 'SonyVolumeGuiKiller-PC-1.0.6-win-x64.zip'
          Compress-Archive -LiteralPath $package -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item -LiteralPath $helper,$guard -Destination $stage
          $assets = @('SonyVolumeGuiKiller-PC-1.0.6-win-x64.zip','SonyVolumeGuiKiller-1.0.5-debug.apk','AdbAutoEnable5555-0.3.5-sony.1-debug.apk')
          $lines = foreach ($asset in $assets) { '{0}  {1}' -f (Get-FileHash (Join-Path $stage $asset)).Hash.ToLowerInvariant(),$asset }
          Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Value $lines -Encoding utf8
          gh release upload v1.0.6 $zip (Join-Path $stage 'SonyVolumeGuiKiller-1.0.5-debug.apk') (Join-Path $stage 'AdbAutoEnable5555-0.3.5-sony.1-debug.apk') (Join-Path $stage 'SHA256SUMS.txt') --clobber
          Check-Exit
          gh release edit v1.0.6 --target $env:GITHUB_SHA --draft=false --latest
          Check-Exit

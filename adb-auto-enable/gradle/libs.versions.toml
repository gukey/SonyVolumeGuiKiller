[versions]
agp = "8.9.2"
conscrypt = "2.5.2"
nanohttpd = "2.3.1"
libadb = "3.1.1"
bouncycastle = "1.81"
androidxAnnotation = "1.9.1"

[libraries]
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
libadb = { group = "com.github.MuntashirAkon", name = "libadb-android", version.ref = "libadb" }
conscrypt = { group = "org.conscrypt", name = "conscrypt-android", version.ref = "conscrypt" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk15to18", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk15to18", version.ref = "bouncycastle" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }